<svg class="dt-illus dt-illus--hero" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dt-hero-illus-t">
  <title id="dt-hero-illus-t">Illustration of a healthy, gleaming tooth</title>
  <defs>
    <radialGradient id="dtH-bg" cx="35%" cy="30%" r="80%">
      <stop offset="0" style="stop-color:var(--c-accent);stop-opacity:.55"/>
      <stop offset=".55" style="stop-color:var(--c-secondary);stop-opacity:.22"/>
      <stop offset="1" style="stop-color:var(--c-primary);stop-opacity:.28"/>
    </radialGradient>
    <linearGradient id="dtH-tooth" x1="0" y1="0" x2="1" y2="1">
