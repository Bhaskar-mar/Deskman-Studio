  <circle cx="280" cy="290" r="262" fill="none" style="stroke:var(--c-secondary)" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="3 9"/>
  <circle cx="280" cy="290" r="186" fill="#FFFFFF" fill-opacity=".45"/>
  <ellipse cx="282" cy="478" rx="120" ry="16" fill="#0B2540" fill-opacity=".08"/>
