    <g>
      <path d="M266 230l40 -12 8 30 -40 12Z" style="fill:var(--c-accent)"/>
      <rect x="270" y="236" width="12" height="200" rx="6" transform="rotate(-14 276 336)" style="fill:var(--c-primary)"/>
      <rect x="252" y="214" width="20" height="44" rx="6" transform="rotate(-14 262 236)" fill="#FFFFFF"/>
      <path d="M256 218v36M262 216v36M268 214v36" transform="rotate(-14 262 236)" style="stroke:var(--c-secondary)" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
